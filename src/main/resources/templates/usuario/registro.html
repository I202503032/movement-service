<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MiBodeguita - Registro</title>
  <link th:href="@{/css/heroic-features.css}" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <div><span class="brand-mark">M</span><div><strong>MiBodeguita</strong><small>Gestión sencilla para tu bodega</small></div></div>
</header>
<main class="container">
  <section class="hero"><p class="eyebrow">NUEVA CUENTA</p><h1>Crea tu perfil de usuario.</h1><p>Regístrate para comenzar a administrar el inventario de tu bodega.</p></section>

  <section class="panel login-panel">
    <div class="panel-heading"><div><p class="eyebrow">REGISTRO</p><h2>Crear cuenta</h2></div><span class="icon-bubble">＋</span></div>
    <form th:action="@{/usuario/save}" method="post">
      <label for="nombre">Nombres</label>
      <input id="nombre" name="nombre" type="text" required placeholder="Ingrese sus nombres" autocomplete="off">

      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" required placeholder="nombre@correo.com" autocomplete="off">

      <label for="direccion">Dirección</label>
      <input id="direccion" name="direccion" type="text" required placeholder="Ingrese su dirección" autocomplete="off">

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required placeholder="Tu contraseña" autocomplete="off">

      <button class="button button-primary full" type="submit">Registrarse</button>
    </form>
    <div style="margin-top: 15px; text-align: center;">
      <a th:href="@{/usuario/login}" class="card-link" style="font-size: 13px; color: #1c6548; font-weight: 700;">¿Ya tienes una cuenta? Inicia sesión</a>
    </div>
  </section>
  <footer>MiBodeguita · Proyecto académico · Spring Boot + Thymeleaf + MySQL</footer>
</main>
</body>
</html>
