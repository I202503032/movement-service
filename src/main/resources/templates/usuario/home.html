<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MiBodeguita - Tienda en Línea</title>
  <link th:href="@{/css/heroic-features.css}" rel="stylesheet">
</head>
<body>
<div th:include="usuario/template_usuario.html:: header" th:if="${sesion==null}"></div>
<div th:include="usuario/template_usuario.html:: header-user" th:unless="${sesion==null}"></div>

<main class="container">
  <section class="hero">
    <p class="eyebrow">CONTROL DE TU NEGOCIO</p>
    <h1>Todo tu inventario, en un solo lugar.</h1>
    <p>Explora los productos disponibles y mantén las cantidades organizadas.</p>
  </section>

  <div class="panel">
    <div class="panel-heading">
      <div>
        <p class="eyebrow">CATÁLOGO</p>
        <h2>Productos Disponibles</h2>
      </div>
      <span class="count-chip" th:text="${#lists.size(productos) + ' productos'}">0 productos</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; margin-top: 20px;">
      <div th:each="producto: ${productos}" class="panel" th:style="${producto.cantidad <= producto.stockMinimo} ? 'padding: 16px; border: 2px solid #dc3545; background-color: #f8d7da; display: flex; flex-direction: column; justify-content: space-between;' : 'padding: 16px; border: 1px solid #e4eae3; display: flex; flex-direction: column; justify-content: space-between;'">
        <div>
          <img th:src="@{/images/{img}(img=${producto.imagen})}" alt="Imagen" style="width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 12px;">
          <strong th:text="${producto.nombre}" style="font-size: 15px; margin-bottom: 6px; display: block;">Nombre</strong>
          <p class="muted" th:text="${producto.descripcion != null ? producto.descripcion : 'Sin descripción'}" style="font-size: 12px; margin-bottom: 10px;"></p>
        </div>
        <div>
          <div style="font-weight: 700; color: #1c6548; margin-bottom: 6px;" th:text="${'S/ ' + #numbers.formatDecimal(producto.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</div>
          <div style="margin-bottom: 10px; font-size: 12px;">
            Stock: <span th:style="${producto.cantidad <= producto.stockMinimo} ? 'color: #dc3545; font-weight: bold; font-size: 1.1rem;' : 'color: #276b46; font-weight: bold;'" th:text="${producto.cantidad}">0</span>
            <span th:if="${producto.cantidad <= producto.stockMinimo}" class="badge bg-danger text-white ms-1" style="font-size: 0.7rem; padding: 2px 6px; background-color: #dc3545; color: #ffffff; border-radius: 4px; font-weight: bold;">⚠️ Stock Crítico</span>
          </div>
          <a th:href="@{/productohome/{id}(id=${producto.id})}" class="button button-primary" style="width: 100%; text-align: center;">Ver producto</a>
        </div>
      </div>
    </div>
  </div>
</main>
<div th:include="usuario/template_usuario.html::footer"></div>
</body>
</html>
