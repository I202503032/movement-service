<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MiBodeguita - Crear Producto</title>
  <link th:href="@{/css/heroic-features.css}" rel="stylesheet">
</head>
<body>
<div th:include="administrador/template_admin.html::header"></div>
<main class="container">
  <section class="hero">
    <p class="eyebrow">NUEVO REGISTRO</p>
    <h1>Agregar producto</h1>
    <p>Registra nuevos artículos y configura sus alertas de stock mínimo.</p>
  </section>

  <section class="panel login-panel" style="max-width: 600px; margin: 0 auto;">
    <form th:action="@{/productos/save}" method="post" enctype="multipart/form-data">
      <label for="nombre">Nombre del producto</label>
      <input id="nombre" name="nombre" type="text" required maxlength="120" placeholder="Ej. Arroz 1 kg" autocomplete="off">

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="2" placeholder="Detalle opcional" autocomplete="off"></textarea>

      <div class="two-col">
        <div>
          <label for="precio">Precio (S/)</label>
          <input id="precio" name="precio" type="number" step="0.01" min="0.01" required placeholder="0.00">
        </div>
        <div>
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" name="cantidad" type="number" min="0" step="1" required placeholder="0">
        </div>
      </div>

      <div class="two-col">
        <div>
          <label for="stockMinimo">Stock Mínimo (Alerta)</label>
          <input id="stockMinimo" name="stockMinimo" type="number" min="0" step="1" value="5" required placeholder="Ej. 5">
        </div>
        <div>
          <label for="img">Imagen (opcional)</label>
          <input id="img" name="img" type="file">
        </div>
      </div>

      <div class="form-actions">
        <button class="button button-primary" type="submit">Guardar producto</button>
        <a class="button button-light" th:href="@{/productos}">Cancelar</a>
      </div>
    </form>
  </section>
</main>
<div th:include="administrador/template_admin.html::footer"></div>
</body>
</html>
