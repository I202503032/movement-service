<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>MiBodeguita - Editar Producto</title>
  <link th:href="@{/css/heroic-features.css}" rel="stylesheet">
</head>
<body>
<div th:include="administrador/template_admin.html::header"></div>
<main class="container">
  <section class="hero">
    <p class="eyebrow">MODIFICAR REGISTRO</p>
    <h1>Editar producto</h1>
    <p>Actualiza los detalles y el stock mínimo del artículo seleccionado.</p>
  </section>

  <section class="panel login-panel" style="max-width: 600px; margin: 0 auto;">
    <form th:action="@{/productos/update}" method="post" enctype="multipart/form-data">
      <input type="hidden" name="id" th:value="${producto.id}">

      <label for="nombre">Nombre del producto</label>
      <input id="nombre" name="nombre" type="text" th:value="${producto.nombre}" required maxlength="120" autocomplete="off">

      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="2" th:text="${producto.descripcion}" autocomplete="off"></textarea>

      <div class="two-col">
        <div>
          <label for="precio">Precio (S/)</label>
          <input id="precio" name="precio" type="number" step="0.01" min="0.01" th:value="${producto.precio}" required>
        </div>
        <div>
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" name="cantidad" type="number" min="0" step="1" th:value="${producto.cantidad}" required>
        </div>
      </div>

      <div class="two-col">
        <div>
          <label for="stockMinimo">Stock Mínimo (Alerta)</label>
          <input id="stockMinimo" name="stockMinimo" type="number" min="0" step="1" th:value="${producto.stockMinimo}" required>
        </div>
        <div>
          <label for="img">Imagen (opcional)</label>
          <input id="img" name="img" type="file">
        </div>
      </div>

      <div class="form-actions">
        <button class="button button-primary" type="submit">Guardar cambios</button>
        <a class="button button-light" th:href="@{/productos}">Cancelar</a>
      </div>
    </form>
  </section>
</main>
<div th:include="administrador/template_admin.html::footer"></div>
</body>
</html>
